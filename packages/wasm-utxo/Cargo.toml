[workspace]
members = [".", "cli"]
resolver = "2"

[package]
name = "wasm-utxo"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[lints.clippy]
all = "warn"

[lints.rust]
# These cfg conditions come from the zebra-chain dependency
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(zcash_unstable, values("zfuture"))',
    'cfg(feature, values("zebra-test"))',
] }

[features]
default = []
inspect = ["dep:num-bigint", "dep:serde_json", "dep:hex"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
strum = { version = "0.27", features = ["derive"] }
miniscript = { git = "https://github.com/BitGo/rust-miniscript", tag = "miniscript-13.0.0-bitgo.5" }
bech32 = "0.11"
# BLAKE2b with personalization for Zcash ZIP-243/ZIP-244/ZIP-316 hashing.
# Already present transitively via the miniscript fork; pinned here as a direct dependency.
blake2 = "0.10"
musig2 = { version = "0.3.1", default-features = false, features = ["k256"] }
getrandom = { version = "0.2", features = ["js"] }
pastey = "0.1"
num-bigint = { version = "0.4", optional = true }
# serde is non-optional: the Ironwood PCZT serialization (always compiled) derives Serialize/
# Deserialize for its postcard mirror struct.
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
hex = { version = "0.4", optional = true }

# Orchard/Ironwood shielded-bundle construction (PCZT Constructor/Signer/Extractor).
# `default-features = false` DROPS the `circuit` feature, so halo2_proofs/halo2_gadgets
# (the heavy prover) are NOT pulled in — only Sinsemilla/pasta/note-encryption. Proving is
# delegated to an external service.
orchard = { version = "0.15", default-features = false, features = ["std"] }
# Client-side re-encryption of an Ironwood output's `out_ciphertext` under a client-managed `ovk`,
# via the public `NoteEncryption::encrypt_outgoing_plaintext` API, parameterized by orchard's own
# `IronwoodDomain`. Version pinned to match orchard 0.15's own dependency so the `Domain` impl and
# this crate's `NoteEncryption<D>` agree on wire types.
zcash_note_encryption = "0.4"
# Scrub the copies of the user's secret key made while deriving the client-managed `ovk`, so the
# "the ovk never leaves this call" guarantee also covers what is left behind in freed memory.
zeroize = "1.8"
# Direct dependency (already present transitively via `miniscript`/`bitcoin`, at the same resolved
# version) so we can enable the `ecdh` module (gated on the `hashes` feature): this derives the
# client's `ovk` as the ECDH shared secret between the BitGo cosigner pubkey and the user's private
# key.
secp256k1 = { version = "0.29", features = ["hashes"] }
rand = "0.8"
# Compact deterministic encoding of the Ironwood PCZT witness (proof-service payload / PSBT carry).
postcard = { version = "1.0", default-features = false, features = ["use-std"] }
# `ff::PrimeField::to_repr` for the one PCZT witness field (`alpha`, a Pallas scalar) that orchard
# exposes only as a curve scalar. Already in-tree via orchard/pasta_curves.
ff = "0.13"

# Pinned to avoid RUSTSEC-2026-0204 (invalid pointer dereference in fmt::Pointer)
crossbeam-epoch = ">=0.9.20"

[dev-dependencies]
base64 = "0.22.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
wasm-bindgen-test = "0.3"
rstest = "0.26.1"
pastey = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# 11.2 is the first release with the `Transaction::V6` / Ironwood (`ironwood_shielded_data`)
# variant used as the txid oracle in the v6 codec tests. Native-only dev-dependency, so its
# pre-release zcash_*/orchard cohort stays out of the shipped wasm artifact.
zebra-chain = { version = "11.2", default-features = false }
# `NonEmpty` is required by `orchard::Bundle::from_parts`, used only in the ironwood_build golden
# test to reconstruct an orchard bundle from on-wire action data. Matches orchard's own version.
nonempty = "0.11"

[build-dependencies]
serde_json = "1.0"

[profile.release]
# this is required to make webpack happy
# https://github.com/webpack/webpack/issues/15566#issuecomment-2558347645
strip = true
