[package]
name = "wasm-utxo-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wasm-utxo-cli"
path = "src/main.rs"

[dependencies]
wasm-utxo = { path = "..", features = ["inspect", "orchard-proving"] }
# The CLI is the stand-in for the key holders (the FVK holder and the FROST signer), so it
# works with orchard key types directly; the version must match wasm-utxo's own dependency.
orchard = { version = "0.15", default-features = false, features = ["std"] }
# Matching wasm-utxo's own pins: the randomizer scalars are Pallas field elements.
ff = "0.13"
pasta_curves = "0.5"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
hex = "0.4"
base64 = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-bigint = "0.4"
colored = "2.1"
ptree = "0.5"
rand = "0.8"

# Used only by the `examples/` Ironwood capture tools (note scanning and tree witnessing).
[dev-dependencies]
incrementalmerkletree = { version = "0.8", features = ["legacy-api"] }
shardtree = "=0.6.2"
zcash_note_encryption = "0.4"
