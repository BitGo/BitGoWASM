# Deny multiple versions of dependencies
[bans]
multiple-versions = "deny"
# Highlight bech32 specifically (ensures it's caught if duplicated)
highlight = "all"
# Skip hex-conservative duplicate (miniscript uses 1.0.1 directly, bitcoin uses 0.2.2 via bitcoin_hashes)
# Skip thiserror/thiserror-impl 1.x duplicate (reddsa/redjubjub pin 1.x; postcard's cobs and
# zcash_script/zebra-chain deps use 2.x) - both are transitive, no shared version to unify on.
skip = [
    { crate = "hex-conservative@0.2.2" },
    { crate = "thiserror@1.0.69" },
    { crate = "thiserror-impl@1.0.69" },
]

# Allow git sources (needed for miniscript)
[sources]
allow-git = ["https://github.com/BitGo/rust-miniscript"]

# Allow common licenses used in the Rust ecosystem
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "CC0-1.0",
    "MITNFA",
    "Unicode-3.0",
    "BSD-3-Clause",
    "Unlicense",
    "BSD-2-Clause",
]
# Clarify license for unlicensed crate
[[licenses.clarify]]
name = "wasm-utxo"
expression = "MIT OR Apache-2.0"
license-files = []
