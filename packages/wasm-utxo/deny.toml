# RustSec advisories: RUSTSEC-2026-0387 (crypto-bigint constant-time issues). k256's Scalar
# add/sub/neg do reach crypto-bigint add_mod/sub_mod/neg_mod during MuSig2 partial signing,
# so the vulnerable code is exercised — but the advisory's constant-time concern is moot for
# this target: wasm-utxo executes under a JS JIT, which gives no constant-time guarantees
# regardless of the crypto-bigint version. Ignore until musig2 moves to k256 0.14+
# (k256 0.14.0 is out and its elliptic-curve 0.14 line drops crypto-bigint entirely,
# but musig2 0.4.1 still pins k256 ^0.13 — wasm-utxo's only path to k256), then delete
# this entry (cargo-deny warns on unmatched ignores).
# ctutils (RUSTSEC-2026-0385) is fixed by its 0.4.6 lockfile bump, no ignore needed.
[advisories]
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "k256 Scalar add/sub/neg reach crypto-bigint add_mod/sub_mod/neg_mod in MuSig2 partial signing, but wasm under a JS JIT gives no constant-time guarantees regardless of the crypto-bigint version; delete when musig2 moves to k256 0.14+ (k256 0.14.0 is out and drops crypto-bigint entirely, but musig2 0.4.1 still pins k256 ^0.13 — wasm-utxo's only path) (cargo-deny warns on unmatched ignores)" },
]
# Deny multiple versions of dependencies
[bans]
multiple-versions = "deny"
# Highlight bech32 specifically (ensures it's caught if duplicated)
highlight = "all"
# Skip hex-conservative duplicate (miniscript uses 1.0.1 directly, bitcoin uses 0.2.2 via bitcoin_hashes)
# Skip thiserror/thiserror-impl 1.x duplicate (reddsa/redjubjub pin 1.x; postcard's cobs and
# zcash_script/zebra-chain deps use 2.x) - both are transitive, no shared version to unify on.
skip = [
    { crate = "hex-conservative@0.2.2" },
    { crate = "thiserror@1.0.69" },
    { crate = "thiserror-impl@1.0.69" },
]

# Allow git sources (needed for miniscript)
[sources]
allow-git = ["https://github.com/BitGo/rust-miniscript"]

# Allow common licenses used in the Rust ecosystem
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "CC0-1.0",
    "MITNFA",
    "Unicode-3.0",
    "BSD-3-Clause",
    "Unlicense",
    "BSD-2-Clause",
]
# Clarify license for unlicensed crate
[[licenses.clarify]]
name = "wasm-utxo"
expression = "MIT OR Apache-2.0"
license-files = []
