# RustSec advisories: the patched crypto-bigint (>=0.7.6, RUSTSEC-2026-0387) is unreachable
# behind k256 0.13.4 (musig2/secp), and wasm-utxo's use of k256 ECDSA does not expose the
# affected constant-time operations to attacker-controlled input — ignore until k256 moves
# to elliptic-curve 0.14+, then delete this entry (cargo-deny warns on unmatched ignores).
# ctutils (RUSTSEC-2026-0385) is fixed by its 0.4.6 lockfile bump, no ignore needed.
[advisories]
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint >=0.7.6 is unreachable behind k256 0.13.4 (musig2/secp); the affected constant-time ops are not exposed on attacker-controlled input in wasm-utxo's k256 usage" },
]
# Deny multiple versions of dependencies
[bans]
multiple-versions = "deny"
# Highlight bech32 specifically (ensures it's caught if duplicated)
highlight = "all"
# Skip hex-conservative duplicate (miniscript uses 1.0.1 directly, bitcoin uses 0.2.2 via bitcoin_hashes)
# Skip thiserror/thiserror-impl 1.x duplicate (reddsa/redjubjub pin 1.x; postcard's cobs and
# zcash_script/zebra-chain deps use 2.x) - both are transitive, no shared version to unify on.
skip = [
    { crate = "hex-conservative@0.2.2" },
    { crate = "thiserror@1.0.69" },
    { crate = "thiserror-impl@1.0.69" },
]

# Allow git sources (needed for miniscript)
[sources]
allow-git = ["https://github.com/BitGo/rust-miniscript"]

# Allow common licenses used in the Rust ecosystem
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "CC0-1.0",
    "MITNFA",
    "Unicode-3.0",
    "BSD-3-Clause",
    "Unlicense",
    "BSD-2-Clause",
]
# Clarify license for unlicensed crate
[[licenses.clarify]]
name = "wasm-utxo"
expression = "MIT OR Apache-2.0"
license-files = []
