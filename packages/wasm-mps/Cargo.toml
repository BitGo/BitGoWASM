[package]
name = "wasm-mps"
version = "0.1.0"
edition = "2021"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[lints.clippy]
all = "warn"

[dependencies]
bincode = { package = "bincode-next", version = "3.1.1", features = ["serde"] }
crypto_box = "0.9"
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
multi-party-schnorr = { git = "https://github.com/silence-laboratories/multi-party-schnorr", rev = "09185d1e4e78d096f2ab3e64d877fb0c88099688", features = ["serde", "eddsa", "redpallas", "vrf"] }
orchard = { version = "0.13", default-features = false }
zcash = { git = "https://github.com/silence-laboratories/garbling", rev = "268a8499bca4f1a1eea532117430fd6fd55310c8", features = ["dkg"] }
pasta_curves = { version = "0.5", default-features = false }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.18"
wasm-bindgen = "0.2"
web-sys = "0.3"

[dev-dependencies]
ed25519-dalek = "2.1.0"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1

[patch.crates-io]
orchard = { git = "https://github.com/zcash/orchard", rev = "f8915bc5c8d1c9fa3124ad28bcf73ce232ef3669" }
