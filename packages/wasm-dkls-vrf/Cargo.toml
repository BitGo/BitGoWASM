[package]
name = "wasm-dkls-vrf"
version = "0.1.0"
edition = "2021"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[lints.clippy]
all = "warn"

[dependencies]
# dkls23-ll is `publish = false` and not on crates.io, so it is a git dependency
# pinned by rev - same pattern as wasm-mps's `zcash` dependency.
dkls23-ll = { git = "https://github.com/silence-laboratories/silent-shard-dkls23-ll", rev = "2079e97f61cd6600608fe2766a6017eb2669179c", features = [
    "vrf",
] }
ciborium = "0.2.1"
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
k256 = { version = "0.13", features = ["ecdsa", "serde"] }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
wasm-bindgen = "0.2"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
